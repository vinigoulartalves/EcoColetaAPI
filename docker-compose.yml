services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD}
    volumes:
      - sqldata:/var/opt/mssql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 20
    restart: unless-stopped

  api:
    image: ${API_IMAGE:-ecocoleta-api:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-local}
    environment:
      ASPNETCORE_ENVIRONMENT: ${APP_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=EcoColetaDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;"
      Jwt__ChaveSecreta: ${JWT_SECRET:?Defina JWT_SECRET}
      Seed__AdminEmail: ${ADMIN_EMAIL:-admin@ecocoleta.com}
      Seed__AdminPassword: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD}
      Swagger__Enabled: ${SWAGGER_ENABLED:-false}
      Https__UseRedirection: "false"
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    networks:
      - backend
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqldata:

networks:
  backend:
    driver: bridge
